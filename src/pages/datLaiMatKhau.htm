<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <title>Đặt lại mật khẩu | MovieF</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#e50914",
              dark: "#09090b",
            },
            fontFamily: {
              sans: ["Plus Jakarta Sans", "sans-serif"],
            },
          },
        },
      };
    </script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }

      .password-input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #3f3f46;
        border-radius: 12px;
        outline: none;
        background: #09090b;
        color: white;
      }

      .password-input:focus {
        border-color: #e50914;
        box-shadow: 0 0 0 3px rgb(229 9 20 / 12%);
      }

      .password-input:disabled {
        opacity: 0.6;
      }
    </style>
  </head>

  <body
    class="min-h-screen bg-dark text-white flex items-center justify-center p-4"
  >
    <main class="w-full max-w-md">
      <!-- Logo -->
      <div class="mb-8 text-center">
        <a
          href="/src/pages/home.html"
          class="text-3xl font-extrabold tracking-tight"
        >
          <span class="text-primary">MOVIE</span><span>F</span>
        </a>

        <p class="mt-2 text-sm text-zinc-500">Thế giới phim dành cho bạn</p>
      </div>

      <!-- Form đặt lại mật khẩu -->
      <section
        class="rounded-2xl border border-zinc-800 bg-zinc-900/80 p-6 shadow-2xl sm:p-8"
      >
        <div class="mb-5 text-center">
          <div
            class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full border border-red-500/20 bg-red-500/10"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="30"
              height="30"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#e50914"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="11" width="18" height="11" rx="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              <path d="M12 15v3"></path>
            </svg>
          </div>

          <h1 class="text-2xl font-extrabold">Đặt lại mật khẩu</h1>

          <p class="mt-3 text-sm leading-6 text-zinc-400">
            Tạo mật khẩu mới để bảo vệ tài khoản MovieF của bạn.
          </p>
        </div>

        <div class="mb-6 rounded-xl border border-zinc-800 bg-zinc-950/70 p-4">
          <p class="text-xs text-zinc-500">Tài khoản đang đặt lại mật khẩu</p>

          <p
            id="emailHienThi"
            class="mt-1 break-all text-sm font-semibold text-white"
          >
            Đang tải email...
          </p>
        </div>

        <form id="formDatLaiMatKhau" novalidate>
          <div class="mb-5">
            <label
              for="matKhauMoi"
              class="mb-2 block text-sm font-semibold text-zinc-300"
            >
              Mật khẩu mới
            </label>

            <input
              id="matKhauMoi"
              class="password-input"
              type="password"
              minlength="8"
              maxlength="128"
              autocomplete="new-password"
              placeholder="Nhập mật khẩu mới"
              required
            />

            <p class="mt-2 text-xs text-zinc-500">
              Mật khẩu cần có ít nhất 8 ký tự.
            </p>
          </div>

          <div class="mb-4">
            <label
              for="xacNhanMatKhau"
              class="mb-2 block text-sm font-semibold text-zinc-300"
            >
              Xác nhận mật khẩu
            </label>

            <input
              id="xacNhanMatKhau"
              class="password-input"
              type="password"
              minlength="8"
              maxlength="128"
              autocomplete="new-password"
              placeholder="Nhập lại mật khẩu mới"
              required
            />
          </div>

          <label
            class="mb-5 flex cursor-pointer items-center gap-2 text-sm text-zinc-400"
          >
            <input id="hienMatKhau" type="checkbox" class="accent-red-600" />
            Hiển thị mật khẩu
          </label>

          <p
            id="thongBao"
            class="mb-4 min-h-5 text-sm"
            role="status"
            aria-live="polite"
          ></p>

          <button
            id="btnLuuMatKhau"
            type="submit"
            class="w-full rounded-xl bg-primary px-4 py-3.5 font-bold text-white transition hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-60"
          >
            Lưu mật khẩu mới
          </button>
        </form>

        <div class="mt-6 border-t border-zinc-800 pt-5 text-center">
          <a
            href="/src/pages/login.html"
            class="text-sm font-semibold text-zinc-400 transition hover:text-white"
          >
            Quay lại đăng nhập
          </a>
        </div>
      </section>

      <p class="mt-6 text-center text-xs text-zinc-600">
        © MovieF. All rights reserved.
      </p>
    </main>
  </body>
</html>
<script type="module" src="/src/main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module" src="./../../src/js/custumer/resetPassword.js"></script>
