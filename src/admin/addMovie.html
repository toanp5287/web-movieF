<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thêm phim mới - MovieF</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              brand: {
                DEFAULT: "#e50914",
                hover: "#b80710",
              },
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }

      /* ===== MOVIEF ADMIN THEME (dùng chung cho mọi trang Admin) ===== */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0f0f0f;
        color: #e5e5e5;
        font-family: "Plus Jakarta Sans", "Inter", sans-serif;
      }

      /* ---------- SIDEBAR ---------- */
      .sidebar {
        width: 16rem;
        padding: 1.25rem;
        background: #0f0f0f;
        border-right: 1px solid #1f1f1f;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow-y: auto;
        z-index: 30;
      }

      .sidebar-logo {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0 0.5rem;
        margin-bottom: 2rem;
      }

      .sidebar-logo-icon {
        width: 2.5rem;
        height: 2.5rem;
        flex-shrink: 0;
        border-radius: 0.75rem;
        background: #e50914;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 12px rgba(229, 9, 20, 0.4);
      }

      .sidebar-title {
        font-size: 1.25rem;
        font-weight: 700;
        line-height: 1.4;
        color: #ffffff;
      }

      .sidebar-subtitle {
        font-size: 0.75rem;
        line-height: 1.4;
        color: #71717a;
      }

      /* ---------- MENU ---------- */
      .menu-nav {
        display: flex;
        flex-direction: column;
        gap: 0.375rem;
      }

      .menu-item {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.625rem 0.875rem;
        border-radius: 0.75rem;
        font-size: 0.875rem;
        font-weight: 500;
        line-height: 1.4;
        color: #a1a1aa;
        text-decoration: none;
        transition:
          background-color 0.2s ease,
          color 0.2s ease;
      }

      .menu-item .material-symbols-outlined {
        font-size: 1.25rem;
      }

      .menu-item:hover {
        background: #1a1a1a;
        color: #ffffff;
      }

      .menu-item.active {
        background: #e50914;
        color: #ffffff;
        font-weight: 600;
      }

      /* ---------- ADMIN ACCOUNT ---------- */
      .sidebar-account {
        border-top: 1px solid #1f1f1f;
        padding-top: 1rem;
      }

      .sidebar-avatar {
        width: 2.25rem;
        height: 2.25rem;
        flex-shrink: 0;
        border-radius: 9999px;
        object-fit: cover;
        outline: 1px solid #27272a;
      }

      .sidebar-account-name {
        font-size: 0.75rem;
        font-weight: 600;
        color: #e4e4e7;
      }

      .sidebar-account-mail {
        font-size: 11px;
        color: #71717a;
      }

      .sidebar-account-btn {
        padding: 0.25rem;
        border-radius: 0.5rem;
        color: #a1a1aa;
        transition: color 0.2s ease;
      }

      .sidebar-account-btn:hover {
        color: #e4e4e7;
      }
    </style>
  </head>

  <body class="font-sans antialiased min-h-screen">
    <!-- SIDEBAR (chuẩn dùng chung cho mọi trang Admin) -->
    <aside class="sidebar fixed left-0 top-0 bottom-0">
      <!-- LOGO -->
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">
          <span class="material-symbols-outlined">movie</span>
        </div>
        <div>
          <h1 class="sidebar-title">MovieF</h1>
          <p class="sidebar-subtitle">Admin Panel</p>
        </div>
      </div>

      <!-- MENU -->
      <nav class="menu-nav">
        <a href="/admin" class="menu-item">
          <span class="material-symbols-outlined">dashboard</span>
          <span>Dashboard</span>
        </a>

        <a href="/admin" class="menu-item active">
          <span class="material-symbols-outlined">movie</span>
          <span>Quản lý phim</span>
        </a>

        <a href="/admin/genres" class="menu-item">
          <span class="material-symbols-outlined">category</span>
          <span>Thể loại</span>
        </a>

        <a href="/admin/users" class="menu-item">
          <span class="material-symbols-outlined">group</span>
          <span>Người dùng</span>
        </a>

        <a href="/admin/reviews" class="menu-item">
          <span class="material-symbols-outlined">reviews</span>
          <span>Đánh giá</span>
        </a>

        <a href="/admin/comments" class="menu-item">
          <span class="material-symbols-outlined">comment</span>
          <span>Bình luận</span>
        </a>

        <a href="/admin/statistics" class="menu-item">
          <span class="material-symbols-outlined">bar_chart</span>
          <span>Thống kê</span>
        </a>

        <a href="/admin/settings" class="menu-item">
          <span class="material-symbols-outlined">settings</span>
          <span>Cài đặt</span>
        </a>
      </nav>

      <!-- ADMIN ACCOUNT -->
      <div class="sidebar-account">
        <div class="flex items-center gap-3">
          <img
            src="/images/avatar/admin.png"
            alt="Admin"
            class="sidebar-avatar"
            onerror="
              this.src =
                'https://ui-avatars.com/api/?name=Admin+MovieF&background=e50914&color=fff'
            "
          />
          <div class="flex-1 min-w-0">
            <p class="sidebar-account-name">MovieF Admin</p>
            <p class="sidebar-account-mail">admin@movief.com</p>
          </div>
          <button class="sidebar-account-btn">
            <span class="material-symbols-outlined text-lg">more_vert</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="md:pl-64 flex flex-col min-h-screen">
      <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-8 py-8">
        <!-- Header -->
        <div
          class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8"
        >
          <div>
            <h1
              class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight"
            >
              Thêm phim mới
            </h1>
            <p class="text-sm text-zinc-400 mt-1">
              Nhập thông tin tác phẩm vào cơ sở dữ liệu MovieF
            </p>
          </div>

          <a
            href="/admin"
            class="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-zinc-300 hover:text-white border border-zinc-800 transition-all text-sm font-medium shadow-sm w-fit"
          >
            <span class="material-symbols-outlined text-lg">arrow_back</span>
            Quay lại
          </a>
        </div>

        <form id="addMovieForm" class="space-y-6"></form>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="./../../src/js/admin/addMovie.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
