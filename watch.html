<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xem phim - MovieF</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="index.html">movie<span>F</span></a>
      <nav>
        <a href="index.html">Trang chủ</a>
        <a href="index.html#grid">Phim lẻ</a>
        <a href="index.html#grid">Phim bộ</a>
        <a href="#">Thể loại</a>
      </nav>
      <div class="search-bar">
        <input type="text" placeholder="Tìm phim..." id="searchInput" />
      </div>
    </header>

    <main class="container">
      <a class="back-link" id="backLink" href="index.html">&larr; Quay lại</a>

      <div class="watch-box">
        <video id="player" controls autoplay></video>
      </div>

      <div class="watch-body">
        <div>
          <h1 class="watch-title" id="title"></h1>
          <p class="tagline" id="subtitle"></p>
        </div>
        <aside>
          <h3 style="margin-bottom: 14px">Phim liên quan</h3>
          <div class="suggest-list" id="suggest"></div>
        </aside>
      </div>
    </main>

    <footer>&copy; 2026 MovieF. Xây dựng để luyện tập - mọi sở hữu thuộc về tác giả. &nbsp;|&nbsp; <a href="admin.html" style="color: var(--muted)">Quản trị</a></footer>

    <script src="assets/movies.js"></script>
    <script>
      const player = document.getElementById("player");
      const suggest = document.getElementById("suggest");

      const id = new URLSearchParams(location.search).get("id");
      const allMovies = loadState().all;
      const movie = getMovie(id);

      if (movie) {
        document.title = movie.title + " - Xem phim";
        document.getElementById("title").textContent = movie.title;
        document.getElementById("subtitle").textContent =
          movie.genre + " \u2022 " + movie.year + " \u2022 " + movie.duration + " \u2022 " + movie.quality;
        document.getElementById("backLink").href = "detail.html?id=" + movie.id;
        player.src = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4";

        suggest.innerHTML = allMovies
          .filter((x) => x.id !== movie.id)
          .slice(0, 6)
          .map(
            (m) => `
            <a class="suggest-card" href="watch.html?id=${m.id}">
              <img src="${m.img}" alt="${m.title}" loading="lazy" />
              <div class="s-info">
                <h4>${m.title}</h4>
                <small>${m.year} &bull; <span class="rating">★ ${m.rating}</span></small>
              </div>
            </a>`
          )
          .join("");
      } else {
        player.style.display = "none";
        document.querySelector(".watch-body").innerHTML =
          '<p class="empty">Không tìm thấy phim. <a class="back-link" href="index.html">Về trang chủ</a></p>';
      }
    </script>
  </body>
</html>
