<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - MovieF</title>
    <link rel="stylesheet" href="assets/style.css" />
    <style>
      .login-box {
        max-width: 380px;
        margin: 80px auto;
        background: var(--surface);
        border: 1px solid var(--surface-2);
        border-radius: 14px;
        padding: 32px;
      }

      .login-box h1 {
        font-size: 1.3rem;
        margin-bottom: 20px;
        text-align: center;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 16px;
      }

      .field label {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .field input,
      .field textarea,
      .field select {
        background: var(--bg);
        border: 1px solid var(--surface-2);
        border-radius: 8px;
        padding: 10px 12px;
        color: var(--text);
        font-size: 0.9rem;
        outline: none;
        font-family: inherit;
      }

      .field input:focus,
      .field textarea:focus,
      .field select:focus {
        border-color: var(--primary);
      }

      .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 8px;
      }

      .admin-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 12px;
      }

      .admin-header h1 {
        font-size: 1.6rem;
      }

      .toolbar {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--surface);
        border-radius: 12px;
        overflow: hidden;
      }

      th,
      td {
        padding: 12px 14px;
        text-align: left;
        border-bottom: 1px solid var(--surface-2);
        font-size: 0.9rem;
      }

      th {
        color: var(--muted);
        font-weight: 600;
        background: var(--surface-2);
      }

      td img {
        width: 40px;
        height: 60px;
        object-fit: cover;
        border-radius: 4px;
      }

      .row-actions {
        display: flex;
        gap: 8px;
      }

      .link-btn {
        background: transparent;
        border: 1px solid var(--surface-2);
        color: var(--text);
        padding: 5px 10px;
        border-radius: 6px;
        font-size: 0.8rem;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.2s;
      }

      .link-btn:hover {
        background: var(--surface-2);
      }

      .link-btn.danger {
        color: #ff6b6b;
      }

      .link-btn.danger:hover {
        background: rgba(255, 107, 107, 0.12);
      }

      .panel {
        display: none;
        background: var(--surface);
        border: 1px solid var(--surface-2);
        border-radius: 14px;
        padding: 24px;
        margin-bottom: 28px;
      }

      .panel.open {
        display: block;
      }

      .panel h2 {
        font-size: 1.15rem;
        margin-bottom: 20px;
      }

      .two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 16px;
      }

      .notice {
        background: rgba(229, 9, 20, 0.12);
        border: 1px solid rgba(229, 9, 20, 0.4);
        color: #ff8a8a;
        padding: 10px 14px;
        border-radius: 8px;
        margin-bottom: 16px;
        font-size: 0.9rem;
      }

      .hidden {
        display: none !important;
      }

      .badge {
        font-size: 0.75rem;
        padding: 2px 10px;
        border-radius: 999px;
        background: var(--surface-2);
        color: var(--muted);
      }

      @media (max-width: 720px) {
        .two-col {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="index.html">movie<span>F</span></a>
      <nav>
        <a href="index.html">Trang chủ</a>
        <a href="admin.html" class="active">Quản trị</a>
      </nav>
      <div></div>
    </header>

    <!-- Login -->
    <section id="loginSection">
      <div class="login-box">
        <h1>Đăng nhập quản trị</h1>
        <form id="loginForm">
          <div class="field">
            <label for="adminUser">Tên đăng nhập</label>
            <input type="text" id="adminUser" value="admin" required />
          </div>
          <div class="field">
            <label for="adminPass">Mật khẩu</label>
            <input type="password" id="adminPass" placeholder="admin123" required />
          </div>
          <button class="btn" type="submit" style="width: 100%">Đăng nhập</button>
        </form>
        <p class="empty" style="font-size: 0.8rem">Mặc định: admin / admin123</p>
      </div>
    </section>

    <!-- Dashboard -->
    <main class="container hidden" id="dashboard">
      <div class="admin-header">
        <div>
          <h1>Quản lý phim</h1>
          <p style="color: var(--muted); font-size: 0.9rem">Thêm, sửa, xóa phim - lưu tự động vào trình duyệt</p>
        </div>
        <div class="toolbar">
          <a class="btn" href="#" onclick="openForm(); return false;">+ Thêm phim mới</a>
          <button class="btn btn-outline btn-sm" onclick="logout()" id="logoutBtn">Đăng xuất</button>
        </div>
      </div>

      <!-- Form thêm / sửa -->
      <section class="panel" id="formPanel">
        <h2 id="formTitle">Thêm phim mới</h2>
        <form id="movieForm">
          <input type="hidden" id="fId" />
          <div class="two-col">
            <div class="field">
              <label for="fTitle">Tên phim *</label>
              <input type="text" id="fTitle" required />
            </div>
            <div class="field">
              <label for="fImg">Link ảnh poster</label>
              <input type="text" id="fImg" placeholder="https://..." />
            </div>
            <div class="field">
              <label for="fGenre">Thể loại *</label>
              <input type="text" id="fGenre" placeholder="Hành động, Chính kịch..." required />
            </div>
            <div class="field">
              <label for="fYear">Năm phát hành *</label>
              <input type="number" id="fYear" min="1900" max="2100" required />
            </div>
            <div class="field">
              <label for="fRating">Điểm IMDb (1-10)</label>
              <input type="number" id="fRating" min="0" max="10" step="0.1" />
            </div>
            <div class="field">
              <label for="fDuration">Thời lượng</label>
              <input type="text" id="fDuration" placeholder="2g 10p" />
            </div>
            <div class="field">
              <label for="fQuality">Chất lượng</label>
              <select id="fQuality">
                <option>Full HD</option>
                <option>HD</option>
                <option>IMAX</option>
                <option>CAM</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="fDesc">Mô tả</label>
            <textarea id="fDesc" rows="4" placeholder="Tóm tắt nội dung phim..."></textarea>
          </div>
          <div class="form-actions">
            <button class="btn" type="submit" id="saveBtn">Lưu phim</button>
            <button class="btn btn-outline btn-sm" type="button" onclick="closeForm()">Hủy</button>
          </div>
        </form>
      </section>

      <div class="notice hidden" id="notice"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Poster</th>
              <th>Tên phim</th>
              <th>Thể loại</th>
              <th>Năm</th>
              <th>Điểm</th>
              <th>Hành động</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </main>

    <footer>&copy; 2026 MovieF. Xây dựng để luyện tập - mọi sở hữu thuộc về tác giả.</footer>

    <script src="assets/movies.js"></script>
    <script>
      const ADMIN_USER = "admin";
      const ADMIN_PASS = "admin123";
      const SESSION_KEY = "movief_admin_session";

      const loginSection = document.getElementById("loginSection");
      const dashboard = document.getElementById("dashboard");
      const formPanel = document.getElementById("formPanel");
      const formTitle = document.getElementById("formTitle");
      const movieForm = document.getElementById("movieForm");
      const tableBody = document.getElementById("tableBody");
      const notice = document.getElementById("notice");

      function showNotice(msg, isError) {
        notice.textContent = msg;
        notice.classList.toggle("hidden", false);
        setTimeout(() => notice.classList.add("hidden"), 3000);
      }

      function isLoggedIn() {
        return sessionStorage.getItem(SESSION_KEY) === "1";
      }

      function renderTable() {
        const { all } = loadState();
        tableBody.innerHTML = all
          .map(
            (m) => `
            <tr>
              <td><img src="${m.img}" alt="${m.title}" /></td>
              <td>${m.title}</td>
              <td>${m.genre}</td>
              <td>${m.year}</td>
              <td><span class="rating">★ ${m.rating}</span></td>
              <td>
                <div class="row-actions">
                  <a class="link-btn" href="detail.html?id=${m.id}" target="_blank">Xem</a>
                  <button class="link-btn" onclick="editMovie(${m.id})">Sửa</button>
                  <button class="link-btn danger" onclick="deleteMovie(${m.id})">Xóa</button>
                </div>
              </td>
            </tr>`
          )
          .join("");
      }

      function openForm(movie) {
        formTitle.textContent = movie ? "Sửa phim" : "Thêm phim mới";
        document.getElementById("fId").value = movie ? movie.id : "";
        document.getElementById("fTitle").value = movie ? movie.title : "";
        document.getElementById("fImg").value = movie ? movie.img : "";
        document.getElementById("fGenre").value = movie ? movie.genre : "";
        document.getElementById("fYear").value = movie ? movie.year : new Date().getFullYear();
        document.getElementById("fRating").value = movie ? movie.rating : "";
        document.getElementById("fDuration").value = movie ? movie.duration : "";
        document.getElementById("fQuality").value = movie ? movie.quality : "Full HD";
        document.getElementById("fDesc").value = movie ? movie.desc : "";
        formPanel.classList.add("open");
        formPanel.scrollIntoView({ behavior: "smooth" });
      }

      function closeForm() {
        formPanel.classList.remove("open");
        movieForm.reset();
      }

      function editMovie(id) {
        openForm(getMovie(id));
      }

      function deleteMovie(id) {
        const { all } = loadState();
        if (!confirm("Xóa phim này?")) return;
        saveState(all.filter((m) => m.id !== id));
        renderTable();
        showNotice("Đã xóa phim.");
      }

      movieForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const { all, nextId } = loadState();
        const id = document.getElementById("fId").value;
        const data = {
          title: document.getElementById("fTitle").value.trim(),
          genre: document.getElementById("fGenre").value.trim(),
          year: Number(document.getElementById("fYear").value),
          rating: Number(document.getElementById("fRating").value) || 0,
          duration: document.getElementById("fDuration").value.trim() || "N/A",
          quality: document.getElementById("fQuality").value,
          desc: document.getElementById("fDesc").value.trim() || "Chưa có mô tả.",
          img: document.getElementById("fImg").value.trim() || "https://picsum.photos/seed/movie" + (id || nextId) + "/400/600",
        };

        if (id) {
          const idx = all.findIndex((m) => m.id === Number(id));
          all[idx] = { ...data, id: Number(id) };
          showNotice("Đã cập nhật phim.");
        } else {
          all.push({ ...data, id: nextId });
          showNotice("Đã thêm phim mới.");
        }
        saveState(all);
        closeForm();
        renderTable();
      });

      function logout() {
        sessionStorage.removeItem(SESSION_KEY);
        location.reload();
      }

      document.getElementById("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const user = document.getElementById("adminUser").value.trim();
        const pass = document.getElementById("adminPass").value;
        if (user === ADMIN_USER && pass === ADMIN_PASS) {
          sessionStorage.setItem(SESSION_KEY, "1");
          location.reload();
        } else {
          showNotice("Sai tên đăng nhập hoặc mật khẩu.");
        }
      });

      if (isLoggedIn()) {
        loginSection.classList.add("hidden");
        dashboard.classList.remove("hidden");
        renderTable();
      }
    </script>
  </body>
</html>
