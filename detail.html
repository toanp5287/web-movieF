<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết phim - MovieF</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="index.html">movie<span>F</span></a>
      <nav>
        <a href="index.html">Trang chủ</a>
        <a href="index.html#grid">Phim lẻ</a>
        <a href="index.html#grid">Phim bộ</a>
        <a href="#">Thể loại</a>
      </nav>
      <div class="search-bar">
        <input type="text" placeholder="Tìm phim..." id="searchInput" />
      </div>
    </header>

    <main class="container">
      <a class="back-link" href="index.html">&larr; Quay lại trang chủ</a>

      <section class="detail" id="detail"></section>

      <div class="section-title" style="margin-top: 48px">
        <h2>Có thể bạn sẽ thích</h2>
      </div>
      <div class="grid" id="related"></div>
    </main>

    <footer>&copy; 2026 MovieF. Xây dựng để luyện tập - mọi sở hữu thuộc về tác giả. &nbsp;|&nbsp; <a href="admin.html" style="color: var(--muted)">Quản trị</a></footer>

    <script src="assets/movies.js"></script>
    <script>
      const detail = document.getElementById("detail");
      const related = document.getElementById("related");

      function renderDetail(m) {
        document.title = m.title + " - MovieF";
        detail.innerHTML = `
          <div class="detail-poster">
            <img src="${m.img}" alt="${m.title}" />
          </div>
          <div>
            <h1>${m.title}</h1>
            <p class="tagline">${m.genre} &bull; ${m.year}</p>
            <div class="info-line">
              <span class="chip rating">★ ${m.rating}/10</span>
              <span class="chip">${m.duration}</span>
              <span class="chip">${m.quality}</span>
            </div>
            <p class="desc">${m.desc}</p>
            <div class="actions">
              <a class="btn" href="watch.html?id=${m.id}">&#9654; Xem phim ngay</a>
              <a class="btn btn-outline btn-sm" href="#">&#128151; Yêu thích</a>
              <a class="btn btn-outline btn-sm" href="#">&#128490; Chia sẻ</a>
            </div>
          </div>`;
      }

      function renderRelated(m) {
        related.innerHTML = allMovies
          .filter((x) => x.id !== m.id)
          .slice(0, 5)
          .map(movieCard)
          .join("");
      }

      const id = new URLSearchParams(location.search).get("id");
      const allMovies = loadState().all;
      const movie = getMovie(id);

      if (movie) {
        renderDetail(movie);
        renderRelated(movie);
      } else {
        detail.innerHTML =
          '<p class="empty">Không tìm thấy phim. <a class="back-link" href="index.html">Về trang chủ</a></p>';
      }
    </script>
  </body>
</html>
